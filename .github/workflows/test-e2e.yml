name: E2E Tests

on:
  push:
  pull_request:

permissions: {}

env:
  KIND_CLUSTER: vault-kms-plugin-openshift-provider-test-e2e
  OPERATOR_NAMESPACE: openshift-kms-plugin-provider
  E2E_IMG: localhost:5001/vault-kms-plugin-openshift-provider:v0.0.1
  E2E_BUNDLE_IMG: localhost:5001/vault-kms-plugin-openshift-provider-bundle:v0.0.1

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install operator-sdk
        run: |
          ARCH=$(go env GOARCH)
          OS=$(go env GOOS)
          curl -sSLo ./operator-sdk https://github.com/operator-framework/operator-sdk/releases/download/v1.42.3/operator-sdk_${OS}_${ARCH}
          chmod +x ./operator-sdk
          sudo mv ./operator-sdk /usr/local/bin/operator-sdk

      - name: Create kind cluster with local registry
        run: |
          docker run -d --restart=always -p 5001:5000 --network bridge --name kind-registry registry:2
          kind create cluster --name $KIND_CLUSTER --config=hack/kind-config.yaml
          docker network connect kind kind-registry || true

      - name: Install OLM
        run: operator-sdk olm install --timeout 5m

      - name: Build and push images
        run: |
          make docker-build IMG=$E2E_IMG
          docker push $E2E_IMG
          make bundle IMG=$E2E_IMG
          make bundle-build BUNDLE_IMG=$E2E_BUNDLE_IMG
          docker push $E2E_BUNDLE_IMG

      - name: Install operator via OLM
        run: |
          kubectl create namespace $OPERATOR_NAMESPACE
          operator-sdk run bundle $E2E_BUNDLE_IMG \
            --namespace $OPERATOR_NAMESPACE \
            --use-http \
            --timeout 5m

      - name: Run e2e tests
        run: |
          go test -tags=e2e ./test/e2e/ -v -ginkgo.v \
            -e2e.namespace=$OPERATOR_NAMESPACE

      - name: Collect debug info on failure
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n $OPERATOR_NAMESPACE || true
          echo "=== CSV ==="
          kubectl get csv -n $OPERATOR_NAMESPACE || true
          echo "=== Operator Logs ==="
          kubectl logs -n $OPERATOR_NAMESPACE -l control-plane=controller-manager --tail=100 || true
          echo "=== Events ==="
          kubectl get events -n $OPERATOR_NAMESPACE --sort-by=.lastTimestamp || true

      - name: Cleanup
        if: always()
        run: |
          operator-sdk cleanup vault-kms-plugin-openshift-provider \
            --namespace $OPERATOR_NAMESPACE || true
          kind delete cluster --name $KIND_CLUSTER || true
          docker rm -f kind-registry || true
