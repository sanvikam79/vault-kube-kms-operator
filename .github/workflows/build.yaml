name: build

on:
  push:
    branches-ignore:
      - 'docs/**'

  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.0.0"
        type: string
        required: false

env:
  PKG_NAME: "vault-kms-plugin-openshift-provider"
  # used by scripts that fetch build tools from GH
  GH_GET_RETRIES: 5

jobs:
  get-product-version:
    runs-on: ubuntu-latest
    outputs:
      product-version: ${{ steps.get-product-version.outputs.product-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: get product version
        id: get-product-version
        run: |
          VERSION="${{ github.event.inputs.version || '0.0.0-dev' }}"
          echo "Using version ${VERSION}"
          echo "product-version=${VERSION}" >> $GITHUB_OUTPUT

  build-pre-checks:
    runs-on: ubuntu-latest
    needs: get-product-version
    outputs:
      go-version: ${{ steps.setup-go.outputs.go-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - name: go mod download all
        run: |
          # download all dependencies to warm up the module cache
          # make sure to run go mod tidy after this since the go.sum file will be updated
          go mod download all
      - name: go mod tidy
        run: |
          go mod tidy
          test -z "$(git status --porcelain)"
      - name: go fmt
        run: |
          make fmt
          test -z "$(git status --porcelain)"
      - name: generate manifests
        run: |
          make generate manifests
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated manifests are out of date. Please run 'make generate manifests' and commit the changes."
            exit 1
          fi
      - name: go vet
        run: |
          make vet

  unit-tests:
    runs-on: ubuntu-latest
    needs:
      - build-pre-checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - run: make test

  generate-metadata-file:
    needs: get-product-version
    runs-on: ubuntu-latest
    outputs:
      filepath: ${{ steps.generate-metadata-file.outputs.filepath }}
    steps:
      - name: Checkout directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate metadata file
        id: generate-metadata-file
        uses: hashicorp/actions-generate-metadata@v1
        with:
          version: ${{ needs.get-product-version.outputs.product-version }}
          product: ${{ env.PKG_NAME }}
          repositoryOwner: "hashicorp"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metadata.json
          path: ${{ steps.generate-metadata-file.outputs.filepath }}

  # The operator ships only a UBI image — no default/distroless image, no binary zips.
  # This mirrors VSO's build-docker-ubi job. The image_tag uses the -ubi suffix
  # so the operator image is clearly distinguishable from any future non-UBI builds.
  build-docker-ubi:
    name: UBI ${{ matrix.arch }} build
    needs:
      - get-product-version
      - build-pre-checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["arm64", "amd64"]
    env:
      repo: ${{ github.event.repository.name }}
      version: ${{ needs.get-product-version.outputs.product-version }}
      image_tag: ${{ needs.get-product-version.outputs.product-version }}-ubi
      # redhat_registry is the quay.io project for Red Hat Partner Connect certification.
      # Update PLACEHOLDER_PROJECT_ID once the operator bundle is registered in Partner Connect.
      redhat_registry: quay.io/redhat-isv-containers/PLACEHOLDER_PROJECT_ID
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Docker Build (Action)
        uses: hashicorp/actions-docker-build@v2
        env:
          VERSION: ${{ env.version }}
          GO_VERSION: ${{ needs.build-pre-checks.outputs.go-version }}
        with:
          version: ${{ env.version }}
          target: release-ubi
          arch: ${{ matrix.arch }}
          redhat_tag: ${{ env.redhat_registry }}:${{ env.image_tag }}
          tags: |
            docker.io/hashicorp/${{ env.repo }}:${{ env.image_tag }}
            public.ecr.aws/hashicorp/${{ env.repo }}:${{ env.image_tag }}

  build-bundle:
    name: OLM bundle image build
    needs:
      - get-product-version
      - build-pre-checks
      - build-docker-ubi
    runs-on: ubuntu-latest
    env:
      version: ${{ needs.get-product-version.outputs.product-version }}
      image_tag: ${{ needs.get-product-version.outputs.product-version }}-ubi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - name: Install operator-sdk
        run: |
          ARCH=$(go env GOARCH)
          OS=$(go env GOOS)
          curl -sSLo ./operator-sdk \
            https://github.com/operator-framework/operator-sdk/releases/download/v1.42.3/operator-sdk_${OS}_${ARCH}
          chmod +x ./operator-sdk
          sudo mv ./operator-sdk /usr/local/bin/operator-sdk
      - name: Build and validate bundle
        env:
          IMG: docker.io/hashicorp/${{ github.event.repository.name }}:${{ env.image_tag }}
          BUNDLE_IMG: docker.io/hashicorp/${{ github.event.repository.name }}-bundle:${{ env.version }}
        run: |
          make bundle IMG=$IMG
          make bundle-build BUNDLE_IMG=$BUNDLE_IMG

  # This job is used as a requirement for the repo's branch protection setup.
  build-done:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - unit-tests
      - build-docker-ubi
      - build-bundle
    steps:
      - name: cancelled
        if: ${{ (contains(needs.*.result, 'cancelled')) }}
        run: exit 2
      - name: passed
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
