apiVersion: kms.openshift.io/v1alpha1
kind: VaultKMSConfig
metadata:
  name: cluster
spec:
  vaultAddress: https://vault.example.com:8200
  vaultKeyPath: transit/keys/etcd-encryption-key
  authentication:
    type: AppRole
    appRole:
      secret:
        name: vault-approle-credentials
