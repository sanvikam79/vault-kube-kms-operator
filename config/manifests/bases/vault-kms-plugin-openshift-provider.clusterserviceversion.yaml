    operatorframework.io/arch.s390x: supported
    operatorframework.io/os.linux: supported
  name: vault-kms-plugin-openshift-provider.v0.0.0-dev
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions: {}
  description: |-
    The Vault KMS Plugin OpenShift Provider operator manages the lifecycle of the
    HashiCorp Vault KMS plugin image reference for OpenShift encryption controllers.

    ## Overview

    This operator creates and enforces a well-known ConfigMap in the
    `openshift-kms-plugin-provider` namespace. Red Hat's
    `cluster-kube-apiserver-operator` reads this ConfigMap to inject the Vault KMS
    plugin as a sidecar container on every master node, enabling etcd encryption
    via HashiCorp Vault's Transit engine.

    The operator has a 1:1 relationship between operator version and plugin version —
    each release bakes a specific digest-pinned plugin image reference into the
    operator binary at compile time.

    See the documentation for more info [here](https://github.com/hashicorp/vault-kms-plugin-openshift-provider).
