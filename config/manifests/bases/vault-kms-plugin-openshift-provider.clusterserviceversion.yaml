    capabilities: Seamless Upgrades
    categories: Security
    containerImage: registry.connect.redhat.com/hashicorp/vault-kms-plugin-openshift-provider
    description: OLM operator that publishes the Vault KMS plugin image reference
      for OpenShift encryption controllers.
    features.operators.openshift.io/cnf: "false"
