  annotations:
    alm-examples: '[]'
    capabilities: Seamless Upgrades
    categories: Security
    containerImage: registry.connect.redhat.com/hashicorp/vault-kube-kms-operator
    description: OLM operator that manages the Vault KMS plugin configuration for
      OpenShift etcd encryption controllers.
    features.operators.openshift.io/cnf: "false"
    features.operators.openshift.io/cni: "false"
    features.operators.openshift.io/csi: "false"
    features.operators.openshift.io/disconnected: "true"
    features.operators.openshift.io/fips-compliant: "true"
    features.operators.openshift.io/proxy-aware: "false"
    features.operators.openshift.io/tls-profiles: "false"
    features.operators.openshift.io/token-auth-aws: "false"
    features.operators.openshift.io/token-auth-azure: "false"
    features.operators.openshift.io/token-auth-gcp: "false"
    repository: https://github.com/hashicorp/vault-kube-kms-operator
    support: HashiCorp
  labels:
    operatorframework.io/arch.amd64: supported
    operatorframework.io/arch.arm64: supported
    operatorframework.io/arch.s390x: supported
    operatorframework.io/os.linux: supported
  name: vault-kube-kms-operator.v0.0.1
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - displayName: Vault KMSConfig
      kind: VaultKMSConfig
      name: vaultkmsconfigs.kms.openshift.io
      version: v1alpha1
  description: |-
    The Vault KMS Operator manages the lifecycle of the HashiCorp Vault KMS plugin
    configuration for OpenShift etcd encryption controllers.

    ## Overview

    This operator introduces a `VaultKMSConfig` custom resource that allows cluster
    administrators to configure HashiCorp Vault as the KMS provider for etcd
    encryption on OpenShift clusters.

    The operator reconciles the `VaultKMSConfig` resource and publishes a
    digest-pinned plugin image reference into the resource status. Red Hat's
    `cluster-kube-apiserver-operator` reads this status to inject the Vault KMS
    plugin as a sidecar container on every master node, enabling etcd encryption
    via HashiCorp Vault's Transit secrets engine.

    The operator has a 1:1 relationship between operator version and plugin version —
    each release bakes a specific digest-pinned plugin image reference into the
    operator binary at compile time.

    See the documentation for more info [here](https://developer.hashicorp.com/vault/docs/platform/k8s/kms).
