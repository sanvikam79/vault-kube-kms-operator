kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Node image is controlled by KIND_K8S_VERSION in the Makefile (default v1.33.1).
# Do not hardcode the image here — let the Makefile --image flag control it.
nodes:
- role: control-plane
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5001"]
    endpoint = ["http://kind-registry:5000"]
