          control-plane: controller-manager
        name: vault-kms-controller-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: vault-kms-plugin-openshift-provider
              control-plane: controller-manager
          strategy: {}
          template:
